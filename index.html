<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1115">
  <meta name="description" content="Reproductor personal de listas IPTV con guía y favoritos.">
  <meta name="referrer" content="no-referrer">
  <title>Onda · IPTV</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./vendor/hls.min.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#inicio"><img src="./assets/icon-192.png" alt=""><span>onda<small>IPTV</small></span></a>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <div class="sidebar-foot"><div id="collection" class="collection"></div></div>
  </aside>
  <div class="shell">
    <header class="top">
      <a class="brand mobile-brand" href="#inicio"><img src="./assets/icon-192.png" alt=""><span>onda</span></a>
      <span id="breadcrumb"></span>
      <div class="top-right">
        <span id="network" class="network" hidden>Sin conexión</span>
        <button id="install" class="button quiet" hidden>Instalar</button>
        <button id="settings" class="button quiet" aria-label="Ajustes"></button>
        <button id="import" class="button primary"></button>
      </div>
    </header>
    <main id="content" tabindex="-1"></main>
  </div>
  <dialog id="import-dialog" aria-labelledby="import-title"></dialog>
  <dialog id="detail" aria-labelledby="detail-title"></dialog>
  <dialog id="player" aria-labelledby="playing-title">
    <div class="player-top">
      <button class="button quiet" data-action="close-player" aria-label="Cerrar reproductor">✕</button>
      <div class="player-heading"><span id="playing-kind" class="label"></span><h2 id="playing-title"></h2></div>
      <button id="player-favorite" class="button quiet" data-action="player-favorite"></button>
      <button class="button quiet cast-action" data-action="cast">Enviar a TV</button>
    </div>
    <div class="screen">
      <video id="video" playsinline controls preload="metadata"></video>
      <div id="cast-screen" hidden></div>
    </div>
    <div id="player-feedback" role="status" hidden></div>
    <div id="player-controls" class="player-controls"></div>
    <div id="player-guide"></div>
  </dialog>
  <button id="cast-dock" class="button" data-action="open-player" hidden></button>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
